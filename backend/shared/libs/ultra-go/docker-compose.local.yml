version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ultrago-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ultrago_password
      POSTGRES_DB: ultrago_auth
    ports:
      - "5433:5432"
    volumes:
      - ultrago_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  ultralution-go:
    build: .
    container_name: ultralution-go
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      CLIENT_NAME: ultralution
      GLOBAL_API_KEY: ultrago_api_key_2026
      POSTGRES_AUTH_DB: postgresql://postgres:ultrago_password@postgres:5432/ultrago_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://postgres:ultrago_password@postgres:5432/ultrago_users?sslmode=disable
      DATABASE_SAVE_MESSAGES: "false"
      WADEBUG: INFO
      LOGTYPE: console
      CONNECT_ON_STARTUP: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ultrago_postgres_data:
