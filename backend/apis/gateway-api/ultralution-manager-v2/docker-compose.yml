version: '3.8'

services:
  ultralution-manager:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    container_name: ultralution-manager-v2
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - ultralution-network
