  #   environment:
  #     SERVER_PORT: "8080"
  #     CLIENT_NAME: "ultracrm"
  #     GLOBAL_API_KEY: ${ULTRA_GO_API_KEY:-ultracrm_secret_key}
  #     POSTGRES_AUTH_DB: postgresql://${POSTGRES_USERNAME:-postgres}:${POSTGRES_PASSWORD:-ultra_dev_password}@postgres:5432/${POSTGRES_DATABASE:-ultra_community}?sslmode=disable
  #     POSTGRES_USERS_DB: postgresql://${POSTGRES_USERNAME:-postgres}:${POSTGRES_PASSWORD:-ultra_dev_password}@postgres:5432/${POSTGRES_DATABASE:-ultra_community}?sslmode=disable
  #     DATABASE_SAVE_MESSAGES: "true"
  #     WADEBUG: "INFO"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  crm_bundle:
  crm_node_modules:
  crm_cache:
  processor_logs:
