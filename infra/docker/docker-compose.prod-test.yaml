# =============================================================================
# Ultra CRM Community — Local Production Test
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  ultra_postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    volumes:
      - ultra_pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ultra_community
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ultra_dev_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ultra_redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    command: ["sh", "-c", "redis-server --requirepass ultra_redis_pass --appendonly yes"]
    volumes:
      - ultra_rd_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "ultra_redis_pass", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # API Gateway (Nginx)
  # ---------------------------------------------------------------------------
  ultra_gateway:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      CORS_ALLOWED_ORIGIN: "2.24.75.87:5173"
    depends_on:
      - ultra_auth
      - ultra_crm

  # ---------------------------------------------------------------------------
  # Auth Service (Ruby / Rails) — Port 3001
  # ---------------------------------------------------------------------------
  ultra_auth:
    build:
      context: ./backend/apis/auth-api
      dockerfile: Dockerfile
    command: sh -c "bundle exec rails db:migrate && bundle exec rails s -p 3001 -b 0.0.0.0"
    ports:
      - "3001:3001"
    environment:
      RAILS_ENV: production
      RAILS_MAX_THREADS: 5
      SECRET_KEY_BASE: "a]i9F#k2$$Lm7Nq0R!sT4uW6xZ8bD1eG3hJ5oP7rV9yAcE2fH4jM6pS8vX0zB3dK5nQ7tU9wY1"
      JWT_SECRET_KEY: "a]i9F#k2$$Lm7Nq0R!sT4uW6xZ8bD1eG3hJ5oP7rV9yAcE2fH4jM6pS8vX0zB3dK5nQ7tU9wY1"
      ULTRA_CRM_API_TOKEN: 6e10e689-58ce-4416-bf0d-f5818bf2dcf8
      POSTGRES_HOST: ultra_postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ultra_dev_password
      POSTGRES_DATABASE: ultra_community
      REDIS_URL: redis://:ultra_redis_pass@ultra_redis:6379/1
      FRONTEND_URL: http://2.24.75.87:5173
      MAILER_SENDER_EMAIL: noreply@ultracrm.local
      DOORKEEPER_JWT_SECRET_KEY: "a]i9F#k2$$Lm7Nq0R!sT4uW6xZ8bD1eG3hJ5oP7rV9yAcE2fH4jM6pS8vX0zB3dK5nQ7tU9wY1"
      DOORKEEPER_JWT_ALGORITHM: hs256
      DOORKEEPER_JWT_ISS: ultra-auth-service
      MFA_ISSUER: Ultra CRM
      SIDEKIQ_CONCURRENCY: 10
      ACTIVE_STORAGE_SERVICE: local
    depends_on:
      ultra_postgres:
        condition: service_healthy
      ultra_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ruby -e \"require 'net/http'; exit Net::HTTP.get_response(URI('http://localhost:3001/health/live')).code.to_i < 500 ? 0 : 1\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 180s

  ultra_auth_sidekiq:
    build:
      context: ./backend/apis/auth-api
      dockerfile: Dockerfile
    command: sh -c "bundle exec sidekiq"
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: "a]i9F#k2$$Lm7Nq0R!sT4uW6xZ8bD1eG3hJ5oP7rV9yAcE2fH4jM6pS8vX0zB3dK5nQ7tU9wY1"
      JWT_SECRET_KEY: "a]i9F#k2$$Lm7Nq0R!sT4uW6xZ8bD1eG3hJ5oP7rV9yAcE2fH4jM6pS8vX0zB3dK5nQ7tU9wY1"
      ULTRA_CRM_API_TOKEN: 6e10e689-58ce-4416-bf0d-f5818bf2dcf8
      POSTGRES_HOST: ultra_postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ultra_dev_password
      POSTGRES_DATABASE: ultra_community
      REDIS_URL: redis://:ultra_redis_pass@ultra_redis:6379/1
      SIDEKIQ_CONCURRENCY: 10
    depends_on:
      ultra_postgres:
        condition: service_healthy
      ultra_redis:
        condition: service_healthy
      ultra_auth:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # CRM Service (Ruby / Rails) — Port 3000
  # ---------------------------------------------------------------------------
  ultra_crm:
    build:
      context: ./backend/apis/crm-api
      dockerfile: docker/Dockerfile
    command: sh -c "bundle exec rails db:ultra_prepare && bundle exec rails s -p 3000 -b 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: production
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_LOG_TO_STDOUT: "true"
      SECRET_KEY_BASE: "a]i9F#k2$$Lm7Nq0R!sT4uW6xZ8bD1eG3hJ5oP7rV9yAcE2fH4jM6pS8vX0zB3dK5nQ7tU9wY1"
      JWT_SECRET_KEY: "a]i9F#k2$$Lm7Nq0R!sT4uW6xZ8bD1eG3hJ5oP7rV9yAcE2fH4jM6pS8vX0zB3dK5nQ7tU9wY1"
      ULTRA_CRM_API_TOKEN: 6e10e689-58ce-4416-bf0d-f5818bf2dcf8
      POSTGRES_HOST: ultra_postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ultra_dev_password
      POSTGRES_DATABASE: ultra_community
      REDIS_URL: redis://:ultra_redis_pass@ultra_redis:6379/0
      ULTRA_AUTH_BASE_URL: http://ultra_auth:3001
      ULTRA_CORE_BASE_URL: http://ultra_core:5555
      BACKEND_URL: http://2.24.75.87
      FRONTEND_URL: http://2.24.75.87:5173
      CORS_ORIGINS: http://2.24.75.87:5173
      DISABLE_TELEMETRY: "true"
      LOG_LEVEL: info
      ENABLE_ACCOUNT_SIGNUP: "true"
      ENABLE_PUSH_RELAY_SERVER: "true"
      ENABLE_INBOX_EVENTS: "true"
      BOT_RUNTIME_URL: http://ultra_bot_runtime:8080
      BOT_RUNTIME_SECRET: ultra-bot-runtime-dev-secret
      BOT_RUNTIME_POSTBACK_BASE_URL: http://ultra_crm:3000
    depends_on:
      ultra_postgres:
        condition: service_healthy
      ultra_redis:
        condition: service_healthy
      ultra_auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ruby -e \"require 'net/http'; Net::HTTP.get_response(URI('http://localhost:3000/health/live')).code.to_i < 500 ? exit(0) : exit(1)\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  ultra_crm_sidekiq:
    build:
      context: ./backend/apis/crm-api
      dockerfile: docker/Dockerfile
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: "a]i9F#k2$$Lm7Nq0R!sT4uW6xZ8bD1eG3hJ5oP7rV9yAcE2fH4jM6pS8vX0zB3dK5nQ7tU9wY1"
      JWT_SECRET_KEY: "a]i9F#k2$$Lm7Nq0R!sT4uW6xZ8bD1eG3hJ5oP7rV9yAcE2fH4jM6pS8vX0zB3dK5nQ7tU9wY1"
      ULTRA_CRM_API_TOKEN: 6e10e689-58ce-4416-bf0d-f5818bf2dcf8
      POSTGRES_HOST: ultra_postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ultra_dev_password
      POSTGRES_DATABASE: ultra_community
      REDIS_URL: redis://:ultra_redis_pass@ultra_redis:6379/0
      ULTRA_AUTH_BASE_URL: http://ultra_auth:3001
      ULTRA_CORE_BASE_URL: http://ultra_core:5555
      BOT_RUNTIME_URL: http://ultra_bot_runtime:8080
      BOT_RUNTIME_SECRET: ultra-bot-runtime-dev-secret
      BOT_RUNTIME_POSTBACK_BASE_URL: http://ultra_crm:3000
    depends_on:
      ultra_postgres:
        condition: service_healthy
      ultra_redis:
        condition: service_healthy
      ultra_crm:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Core Service (Go / Gin) — Port 5555
  # ---------------------------------------------------------------------------
  ultra_core:
    build:
      context: ./backend/apis/core-api
      dockerfile: Dockerfile
    ports:
      - "5555:5555"
    environment:
      DB_HOST: ultra_postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ultra_dev_password
      DB_NAME: ultra_community
      DB_SSLMODE: disable
      DB_MAX_IDLE_CONNS: 10
      DB_MAX_OPEN_CONNS: 100
      DB_CONN_MAX_LIFETIME: 1h
      DB_CONN_MAX_IDLE_TIME: 30m
      PORT: "5555"
      SECRET_KEY_BASE: "a]i9F#k2$$Lm7Nq0R!sT4uW6xZ8bD1eG3hJ5oP7rV9yAcE2fH4jM6pS8vX0zB3dK5nQ7tU9wY1"
      JWT_SECRET_KEY: "a]i9F#k2$$Lm7Nq0R!sT4uW6xZ8bD1eG3hJ5oP7rV9yAcE2fH4jM6pS8vX0zB3dK5nQ7tU9wY1"
      JWT_ALGORITHM: HS256
      ENCRYPTION_KEY: XoQPOBw2FrzjQS11utERG9qO2MsAnXFxlhIns_uUxRk=
      ULTRA_CRM_BASE_URL: http://ultra_crm:3000
      ULTRA_AUTH_BASE_URL: http://ultra_auth:3001
      AI_PROCESSOR_URL: http://ultra_processor:8000
      AI_PROCESSOR_VERSION: v1
    depends_on:
      ultra_postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Processor Service (Python / FastAPI) — Port 8000
  # ---------------------------------------------------------------------------
  ultra_processor:
    build:
      context: ./backend/apis/processor-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      POSTGRES_CONNECTION_STRING: postgresql://postgres:ultra_dev_password@ultra_postgres:5432/ultra_community
      REDIS_HOST: ultra_redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ultra_redis_pass
      REDIS_SSL: "false"
      REDIS_DB: 0
      REDIS_KEY_PREFIX: "a2a:"
      REDIS_TTL: 3600
      HOST: 0.0.0.0
      PORT: "8000"
      DEBUG: "false"
      SECRET_KEY_BASE: "a]i9F#k2$$Lm7Nq0R!sT4uW6xZ8bD1eG3hJ5oP7rV9yAcE2fH4jM6pS8vX0zB3dK5nQ7tU9wY1"
      ENCRYPTION_KEY: XoQPOBw2FrzjQS11utERG9qO2MsAnXFxlhIns_uUxRk=
      ULTRA_CRM_API_TOKEN: 6e10e689-58ce-4416-bf0d-f5818bf2dcf8
      ULTRA_AI_CRM_URL: http://ultra_crm:3000
      ULTRA_AUTH_BASE_URL: http://ultra_auth:3001
      ULTRA_CORE_BASE_URL: http://ultra_core:5555
      CORE_SERVICE_URL: http://ultra_core:5555/api/v1
      APP_URL: http://localhost:8000
      API_TITLE: Ultra CRM Agent Processor
      API_DESCRIPTION: Agent Processor for Ultra CRM
      API_VERSION: 1.0.0
      API_URL: http://localhost:8000
      ORGANIZATION_NAME: Ultra CRM
      TOOLS_CACHE_ENABLED: "true"
      TOOLS_CACHE_TTL: 3600
    volumes:
      - ultra_processor_logs:/app/logs
    depends_on:
      ultra_postgres:
        condition: service_healthy
      ultra_redis:
        condition: service_healthy
      ultra_core:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Bot Runtime (Go / Gin) — Port 8080
  # ---------------------------------------------------------------------------
  ultra_bot_runtime:
    build:
      context: ./backend/workers/bot-runtime
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      REDIS_URL: redis://:ultra_redis_pass@ultra_redis:6379
      AI_PROCESSOR_URL: http://ultra_processor:8000
      BOT_RUNTIME_SECRET: ultra-bot-runtime-dev-secret
      AI_CALL_TIMEOUT_SECONDS: 30
    depends_on:
      ultra_redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Frontend (React / Vite / Nginx) — Port 5173
  # ---------------------------------------------------------------------------
  ultra_frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      VITE_APP_ENV: production
      VITE_API_URL: http://2.24.75.87
      VITE_AUTH_API_URL: http://2.24.75.87
      VITE_ULTRA_API_URL: http://2.24.75.87
      VITE_AGENT_PROCESSOR_URL: http://2.24.75.87

  # ---------------------------------------------------------------------------
  # Ultra API (Ultra Go) — Port 8081
  # ---------------------------------------------------------------------------
  ultra_api:
    build:
      context: ./backend/shared/libs/ultra-go
      dockerfile: Dockerfile
    container_name: ultra_api
    restart: always
    ports:
      - "8081:8080"
    environment:
      - SERVER_NAME=UltraAPI
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://2.24.75.87:8081
      - GLOBAL_API_KEY=429683C4C977415CAAFCCE10F7D57E11
      - CLIENT_NAME=ultracrm
      - POSTGRES_AUTH_DB=postgresql://postgres:ultra_dev_password@ultra_postgres:5432/ultra_community?sslmode=disable
      - POSTGRES_USERS_DB=postgresql://postgres:ultra_dev_password@ultra_postgres:5432/ultra_community?sslmode=disable
      - DATABASE_SAVE_MESSAGES=false
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://ultra_redis:6379/6
      - CACHE_REDIS_PREFIX_KEY=ultracrm
      - CONNECT_ON_STARTUP=true
      - LOGTYPE=console
    depends_on:
      - ultra_postgres
      - ultra_redis

volumes:
  ultra_pg_data:
  ultra_rd_data:
  ultra_processor_logs:
